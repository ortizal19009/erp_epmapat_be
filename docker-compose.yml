services:
  erp_epmapat_be:
    build: .
    image: erp_epmapat_be
    container_name: erp_epmapat_be
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://192.168.0.55:5432/ErpEpmapaT
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=12345
      - SPRING_PROFILES_ACTIVE=prod
      - STORAGE_TYPE=nextcloud
      - NEXTCLOUD_BASE_URL=https://192.168.0.52
      - NEXTCLOUD_USERNAME=admin
      - NEXTCLOUD_PASSWORD=Epmapat2026
      - NEXTCLOUD_BASE_FOLDER=/EPMAPAT-PHOTOS/
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/erp_epmapat-v0.1.war:/usr/local/tomcat/webapps/ROOT.war
      - ./backups/postgres:/var/backups/postgres
    restart: always
    networks:
      - erp_epmapat

networks:
  erp_epmapat:
    driver: bridge 
